[package]
name = "r0db"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rrs-lib = "0.1.0"
elf = "0.7.4"
anyhow = "1.0.75"
bytemuck = "1.14.0"
byteorder = "1.5.0"
sha2 = { version = "0.10.8", features = ["compress"] }
crypto-bigint = { version = "0.5", default-features = false, features = ["rand"] }
getrandom = "0.2.11"
serde = "1.0.193"
gdbstub = "0.7.0"
gdbstub_arch = "0.3.0"
keccak = "0.1.6"
malachite = { version = "0.4.22", default-features = false, features = ["naturals_and_integers", "32_bit_limbs"] }
num-derive = "0.4.2"
num-traits = "0.2.19"
risc0-core = { version = "5.0.0-rc.1", default-features = false }
risc0-binfmt = "5.0.0-rc.1"
risc0-circuit-rv32im = { version = "5.0.0-rc.1", default-features = false, features = ["execute"] }
risc0-zkos-v1compat = "5.0.0-rc.1"
risc0-zkvm-platform = { version = "5.0.0-rc.1", default-features = false }
risc0-zkvm = { version = "5.0.0-rc.1", default-features = false, features = ["prove"] }
risc0-zkp = { version = "5.0.0-rc.1", default-features = false }
